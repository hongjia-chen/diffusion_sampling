[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-adaptive-ablation"
version = "0.1.0"
description = "Deterministic fixed-k and dependence-aware Dream decoding benchmark"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dream_ablation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

