[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-re"
version = "0.1.0"
description = "Adaptive-delta sampling: SDAR proposer, Dream verifier, remasking"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["adaptive_re*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
