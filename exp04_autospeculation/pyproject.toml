[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autospeculation"
version = "0.1.0"
description = "Autospeculative parallel sampling (arXiv:2511.07869 Algorithm 3) vs fixed-k and adaptive commitment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["autospec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import scripts.run_benchmark for the sigma helpers
pythonpath = ["."]
